set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-style "fg=colour240,bg=default"
set -g window-status-current-style "fg=white,bg=default,bold"
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""
set -g remain-on-exit "off"
set -g mouse on
set -g destroy-unattached off
set -g exit-unattached off
# for debugging

bind r source-file "~/.config/tmux/tmux.conf"
bind b set -g status
bind x kill-window
bind-key -n M-BSpace send-keys C-w
bind f run-shell "~/.config/scripts/tmux-session-dispensary.sh && tmux refresh-client -S"
bind S choose-tree -sZ
bind g run-shell "~/.config/scripts/open-github.sh"
bind t run-shell "tmux neww ~/.config/scripts/time.sh"
bind p run "tmux neww ~/.config/scripts/open-pdf.sh"
bind N run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Projects/Notes && tmux refresh-client -S"
bind P run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Projects && tmux refresh-client -S"
bind C run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/.config && tmux refresh-client -S"
bind H run-shell "~/.config/scripts/tmux-session-dispensary.sh ~ && tmux refresh-client -S"
bind l run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Downloads && tmux refresh-client -S"
bind G neww -n "git" -S lazygit
bind y neww -n "yazi" -S yazi
bind E show-environment -g
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-shell-history 'on'

run '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'
