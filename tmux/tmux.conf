set -a terminal-features "tmux-256color:RGB"
set -g prefix C-SPACE
set -g base-index 1
set -g renumber-windows on   
set -g mode-keys vi
set -g status-position top
set -g status-justify absolute-centre
set -g status-style "bg=default"
set -g window-status-style "fg=colour240,bg=default"
set -g window-status-current-style "fg=white,bg=default,bold"
set -g window-status-separator ""
set -g window-status-format " #I:#W#{?window_flags,#{window_flags},} "
set -g window-status-current-format " #I:#W#{?window_flags,#{window_flags},} "
set -g status-interval 5
set -g status-left "#S"
set -g status-right ""
set -g remain-on-exit "off"
set -g mouse on
set -g destroy-unattached off
set -g exit-unattached off
# for debugging

bind r source-file "~/.config/tmux/tmux.conf"
bind b switch-client -l
bind x kill-window
bind-key -n M-BSpace send-keys C-w
bind c new-window -c '#{pane_current_path}'
bind C-Space send-prefix
bind f neww -c '#{pane_current_path}' -n sessions -e SESSION_PICKER_WINDOW=1 'bash ~/.config/scripts/tmux-session-dispensary.sh'
bind g run-shell "~/.config/scripts/open-github.sh"
bind t neww -n time ~/.config/scripts/time.sh
bind p neww -c '#{pane_current_path}' -n pdf 'bash ~/.config/scripts/open-pdf.sh'
bind P run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Projects"
bind N run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Projects/Notes"
bind C run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/.config"
bind H run-shell "~/.config/scripts/tmux-session-dispensary.sh ~"
bind l run-shell "~/.config/scripts/tmux-session-dispensary.sh ~/Downloads"
unbind k
unbind T
bind s neww -c '#{pane_current_path}' -n scripts 'bash ~/.config/scripts/script-picker.sh --list-from ~/.config/scripts'
bind S neww -c '#{pane_current_path}' -n scripts 'bash ~/.config/scripts/script-picker.sh'

bind G neww -n "git" -S lazygit
bind y neww -n "yazi" -S yazi
bind E show-environment -g
bind k neww -c '#{pane_current_path}' -n typst 'bash ~/.config/scripts/typst-preview-picker.sh'
# PDF / image -> Typst source, written into the current directory
bind d neww -c '#{pane_current_path}' -n doc2typst 'bash ~/.config/scripts/doc2typst-picker.sh'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-save-shell-history 'on'


run '~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux'
run '~/.config/tmux/plugins/tmux-continuum/continuum.tmux'

set-hook -g client-session-changed 'run-shell "~/.config/scripts/kill-opencode.sh \"#{client_last_session}\""'

set-hook -g client-detached 'run-shell "~/.config/scripts/kill-opencode.sh \"#{client_session}\""'
